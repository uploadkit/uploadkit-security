[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-security"
version = "0.2.1"
description = "Reusable security validators for UploadKit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "security", "validation", "mime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.2.0",
]

[project.optional-dependencies]
magic = ["python-magic>=0.4.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage>=7.0",
    "uploadkit-testing>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-security"
Repository = "https://github.com/uploadkit/uploadkit-security"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
